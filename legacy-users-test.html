<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechLib - Limpeza de perfis antigos</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1100px; margin: 35px auto; padding: 0 20px; }
    .box { border: 1px solid #bbb; border-radius: 10px; padding: 16px; margin: 18px 0; }
    button { padding: 10px 16px; cursor: pointer; margin-right: 8px; }
    pre { background: #111; color: #eee; padding: 18px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
    label { display: block; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>TechLib - Limpeza de perfis antigos</h1>
  <p>Esta página só lista como candidatos os perfis com domínio antigo <code>@estudante.gov.rn.br</code> que possuem uma conta atual correspondente em <code>@estudante.rn.gov.br</code> com UID diferente.</p>

  <div class="box">
    <button id="preview">Atualizar prévia</button>
    <button id="delete" disabled>Remover selecionados</button>
    <div id="list"></div>
  </div>

  <pre id="result">Aguardando...</pre>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB46S94ee_c-00vExyjyRABDCEKHrr4Wy4",
      authDomain: "techlib-e308a.firebaseapp.com",
      projectId: "techlib-e308a",
      storageBucket: "techlib-e308a.firebasestorage.app",
      messagingSenderId: "63070344950",
      appId: "1:63070344950:web:44f731360f3baaccbb3ed7",
      measurementId: "G-4SS1CM5X4H"
    };

    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const previewBtn = document.getElementById("preview");
    const deleteBtn = document.getElementById("delete");
    const listEl = document.getElementById("list");
    const resultEl = document.getElementById("result");

    async function token() {
      const user = auth.currentUser;
      if (!user) throw new Error("Entre no TechLib com a conta de Administrador.");
      return await user.getIdToken(true);
    }

    async function preview() {
      const idToken = await token();
      const response = await fetch("/api/legacy-users", {
        headers: { Authorization: `Bearer ${idToken}` }
      });
      const data = await response.json();
      resultEl.textContent = JSON.stringify(data, null, 2);
      listEl.innerHTML = "";

      if (!response.ok || !data.ok) {
        deleteBtn.disabled = true;
        return;
      }

      for (const item of data.candidates || []) {
        const label = document.createElement("label");
        label.innerHTML = `
          <input type="checkbox" value="${item.legacyUid}">
          <strong>${item.name || "(sem nome)"}</strong>
          ${item.legacyEmail} → ${item.correctedEmail}
          <small>UID antigo: ${item.legacyUid} | UID atual: ${item.currentUid}</small>
        `;
        listEl.appendChild(label);
      }

      deleteBtn.disabled = !(data.candidates || []).length;
    }

    async function removeSelected() {
      const selected = [...document.querySelectorAll('input[type="checkbox"]:checked')]
        .map((el) => el.value);

      if (!selected.length) {
        alert("Selecione ao menos um perfil antigo.");
        return;
      }

      if (!confirm(`Remover ${selected.length} perfil(is) antigo(s) do Firestore?`)) {
        return;
      }

      const idToken = await token();
      const response = await fetch("/api/legacy-users", {
        method: "POST",
        headers: {
          Authorization: `Bearer ${idToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          action: "delete-selected",
          legacyUids: selected
        })
      });

      const data = await response.json();
      resultEl.textContent = JSON.stringify(data, null, 2);

      if (response.ok && data.ok) {
        await preview();
      }
    }

    previewBtn.addEventListener("click", () => preview().catch((e) => {
      resultEl.textContent = JSON.stringify({ ok: false, error: e.message }, null, 2);
    }));

    deleteBtn.addEventListener("click", () => removeSelected().catch((e) => {
      resultEl.textContent = JSON.stringify({ ok: false, error: e.message }, null, 2);
    }));

    onAuthStateChanged(auth, () => {
      preview().catch((e) => {
        resultEl.textContent = JSON.stringify({ ok: false, error: e.message }, null, 2);
      });
    });
  </script>
</body>
</html>
